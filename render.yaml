services:
  - type: web
    name: airpurify-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AQI_STANDARD
        value: CPCB
      - key: FALLBACK_TO_MOCK_DB
        value: "true"
      - key: MONGODB_DB_NAME
        value: airpurify_ai
